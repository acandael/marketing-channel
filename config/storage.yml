test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 (S3-compatible). Configure via credentials
# (cloudflare_r2.{access_key_id,secret_access_key,bucket,endpoint})
# or via R2_* environment variables.
cloudflare:
  service: S3
  access_key_id: <%= Rails.application.credentials.dig(:cloudflare_r2, :access_key_id) || ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= Rails.application.credentials.dig(:cloudflare_r2, :secret_access_key) || ENV["R2_SECRET_ACCESS_KEY"] %>
  region: auto
  bucket: <%= Rails.application.credentials.dig(:cloudflare_r2, :bucket) || ENV["R2_BUCKET"] %>
  endpoint: <%= Rails.application.credentials.dig(:cloudflare_r2, :endpoint) || ENV["R2_ENDPOINT"] %>
  force_path_style: true
  request_checksum_calculation: when_required
  response_checksum_validation: when_required
